<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login Flow</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .section { margin: 20px 0; padding: 15px; background: #2a2a2a; border-radius: 8px; }
        h2 { color: #4CAF50; }
        pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; }
        input { padding: 8px; margin: 5px; width: 300px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        button { padding: 10px 20px; margin: 5px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        .error { color: #f44336; }
        .success { color: #4CAF50; }
        .warning { color: #ff9800; }
    </style>
</head>
<body>
    <h1>🧪 Login Flow Test</h1>
    
    <div class="section">
        <h2>Step 1: Test Login API</h2>
        <input type="email" id="email" placeholder="Email" value="customer@test.com" />
        <input type="password" id="password" placeholder="Password" value="Test@123" />
        <button onclick="testLogin()">Test Login</button>
        <pre id="loginResult"></pre>
    </div>

    <div class="section">
        <h2>Step 2: Check LocalStorage</h2>
        <button onclick="checkStorage()">Check Storage</button>
        <pre id="storageResult"></pre>
    </div>

    <div class="section">
        <h2>Step 3: Test Profile API</h2>
        <button onclick="testProfile()">Test Profile</button>
        <pre id="profileResult"></pre>
    </div>

    <div class="section">
        <h2>Step 4: Test Protected Route Logic</h2>
        <button onclick="testProtectedRoute()">Test Auth Check</button>
        <pre id="routeResult"></pre>
    </div>

    <div class="section">
        <h2>Actions</h2>
        <button onclick="clearAll()">Clear All Data</button>
        <button onclick="runFullTest()">Run Full Test</button>
    </div>

    <script>
        async function testLogin() {
            const resultEl = document.getElementById('loginResult');
            resultEl.textContent = 'Testing login...';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/gateway/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultEl.innerHTML = `<span class="success">✅ Login successful!</span>\n\n` +
                        `Status: ${response.status}\n` +
                        `Response:\n${JSON.stringify(data, null, 2)}`;
                    
                    // Extract and save tokens
                    const authData = data.data || data;
                    if (authData.accessToken || authData.AccessToken) {
                        const token = authData.accessToken || authData.AccessToken;
                        localStorage.setItem('accessToken', token);
                        resultEl.innerHTML += `\n\n<span class="success">✅ Access token saved to localStorage</span>`;
                    }
                    if (authData.refreshToken || authData.RefreshToken) {
                        const refreshToken = authData.refreshToken || authData.RefreshToken;
                        localStorage.setItem('refreshToken', refreshToken);
                        resultEl.innerHTML += `\n<span class="success">✅ Refresh token saved to localStorage</span>`;
                    }
                    
                    // Save user
                    const userData = {
                        email,
                        role: authData.role || authData.Role || 'Customer',
                        fullName: authData.fullName || authData.FullName || email.split('@')[0]
                    };
                    localStorage.setItem('user', JSON.stringify(userData));
                    resultEl.innerHTML += `\n<span class="success">✅ User data saved to localStorage</span>`;
                    
                } else {
                    resultEl.innerHTML = `<span class="error">❌ Login failed!</span>\n\n` +
                        `Status: ${response.status}\n` +
                        `Response:\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        function checkStorage() {
            const resultEl = document.getElementById('storageResult');
            
            const token = localStorage.getItem('accessToken');
            const refreshToken = localStorage.getItem('refreshToken');
            const user = localStorage.getItem('user');
            
            let result = '';
            
            if (token) {
                result += `<span class="success">✅ Access Token Found</span>\n`;
                result += `Token (first 50 chars): ${token.substring(0, 50)}...\n\n`;
                
                // Decode JWT
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    const decoded = JSON.parse(jsonPayload);
                    
                    const now = Math.floor(Date.now() / 1000);
                    const isExpired = decoded.exp && decoded.exp < now;
                    
                    result += `Decoded Token:\n${JSON.stringify(decoded, null, 2)}\n\n`;
                    result += isExpired ? 
                        `<span class="error">❌ TOKEN EXPIRED</span>\n` : 
                        `<span class="success">✅ TOKEN VALID</span>\n`;
                    result += `Expires: ${new Date(decoded.exp * 1000).toLocaleString()}\n\n`;
                } catch (e) {
                    result += `<span class="error">❌ Failed to decode token: ${e.message}</span>\n\n`;
                }
            } else {
                result += `<span class="error">❌ No Access Token</span>\n\n`;
            }
            
            if (refreshToken) {
                result += `<span class="success">✅ Refresh Token Found</span>\n\n`;
            } else {
                result += `<span class="warning">⚠️ No Refresh Token</span>\n\n`;
            }
            
            if (user) {
                result += `<span class="success">✅ User Data Found</span>\n`;
                try {
                    result += `User:\n${JSON.stringify(JSON.parse(user), null, 2)}\n`;
                } catch (e) {
                    result += `<span class="error">❌ Failed to parse user: ${e.message}</span>\n`;
                }
            } else {
                result += `<span class="error">❌ No User Data</span>\n`;
            }
            
            resultEl.innerHTML = result;
        }

        async function testProfile() {
            const resultEl = document.getElementById('profileResult');
            resultEl.textContent = 'Testing profile API...';
            
            const token = localStorage.getItem('accessToken');
            if (!token) {
                resultEl.innerHTML = '<span class="error">❌ No access token found. Login first!</span>';
                return;
            }

            try {
                const response = await fetch('/gateway/auth/profile', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultEl.innerHTML = `<span class="success">✅ Profile API works!</span>\n\n` +
                        `Status: ${response.status}\n` +
                        `Response:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultEl.innerHTML = `<span class="error">❌ Profile API failed!</span>\n\n` +
                        `Status: ${response.status}\n` +
                        `Response:\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        function testProtectedRoute() {
            const resultEl = document.getElementById('routeResult');
            
            const token = localStorage.getItem('accessToken');
            const user = localStorage.getItem('user');
            
            let result = 'Simulating ProtectedRoute logic:\n\n';
            
            // Check loading state
            result += '1. Loading state: false (simulated)\n';
            
            // Check authentication
            const isAuthenticated = !!(token && user);
            result += `2. isAuthenticated: ${isAuthenticated}\n`;
            
            if (!isAuthenticated) {
                result += '\n<span class="error">❌ WOULD REDIRECT TO /login</span>\n';
                result += 'Reason: No token or user in localStorage\n';
            } else {
                result += '\n<span class="success">✅ AUTHENTICATION PASSED</span>\n';
                
                // Check role
                try {
                    const userData = JSON.parse(user);
                    result += `\nUser Role: ${userData.role}\n`;
                    result += `User Email: ${userData.email}\n`;
                    result += `User Name: ${userData.fullName}\n`;
                    
                    result += '\n<span class="success">✅ WOULD ALLOW ACCESS</span>\n';
                } catch (e) {
                    result += `\n<span class="error">❌ Failed to parse user: ${e.message}</span>\n`;
                }
            }
            
            resultEl.innerHTML = result;
        }

        function clearAll() {
            localStorage.clear();
            alert('All data cleared!');
            location.reload();
        }

        async function runFullTest() {
            await testLogin();
            await new Promise(resolve => setTimeout(resolve, 1000));
            checkStorage();
            await new Promise(resolve => setTimeout(resolve, 1000));
            await testProfile();
            await new Promise(resolve => setTimeout(resolve, 1000));
            testProtectedRoute();
        }

        // Auto-check storage on load
        window.addEventListener('load', checkStorage);
    </script>
</body>
</html>
