<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .section { margin: 20px 0; padding: 15px; background: #2a2a2a; border-radius: 8px; }
        h2 { color: #4CAF50; }
        pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        .error { color: #f44336; }
        .success { color: #4CAF50; }
    </style>
</head>
<body>
    <h1>🔍 Authentication Debug Tool</h1>
    
    <div class="section">
        <h2>LocalStorage Contents</h2>
        <pre id="localStorage"></pre>
    </div>

    <div class="section">
        <h2>JWT Token Decoded</h2>
        <pre id="tokenDecoded"></pre>
    </div>

    <div class="section">
        <h2>User Object</h2>
        <pre id="userObject"></pre>
    </div>

    <div class="section">
        <h2>Test Profile API</h2>
        <button onclick="testProfileAPI()">Test GET /gateway/auth/profile</button>
        <pre id="profileResult"></pre>
    </div>

    <div class="section">
        <h2>Actions</h2>
        <button onclick="clearAuth()">Clear All Auth Data</button>
        <button onclick="location.reload()">Refresh Page</button>
    </div>

    <script>
        function displayLocalStorage() {
            const storage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                storage[key] = localStorage.getItem(key);
            }
            document.getElementById('localStorage').textContent = JSON.stringify(storage, null, 2);
        }

        function decodeJWT(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return { error: e.message };
            }
        }

        function displayToken() {
            const token = localStorage.getItem('accessToken');
            if (token) {
                const decoded = decodeJWT(token);
                const now = Math.floor(Date.now() / 1000);
                const isExpired = decoded.exp && decoded.exp < now;
                
                document.getElementById('tokenDecoded').innerHTML = 
                    JSON.stringify(decoded, null, 2) + 
                    '\n\n<span class="' + (isExpired ? 'error' : 'success') + '">' +
                    (isExpired ? '❌ TOKEN EXPIRED' : '✅ TOKEN VALID') +
                    '</span>\n' +
                    'Issued: ' + (decoded.iat ? new Date(decoded.iat * 1000).toLocaleString() : 'N/A') + '\n' +
                    'Expires: ' + (decoded.exp ? new Date(decoded.exp * 1000).toLocaleString() : 'N/A');
            } else {
                document.getElementById('tokenDecoded').textContent = 'No access token found';
            }
        }

        function displayUser() {
            const user = localStorage.getItem('user');
            if (user) {
                try {
                    document.getElementById('userObject').textContent = JSON.stringify(JSON.parse(user), null, 2);
                } catch (e) {
                    document.getElementById('userObject').textContent = 'Error parsing user: ' + e.message;
                }
            } else {
                document.getElementById('userObject').textContent = 'No user object found';
            }
        }

        async function testProfileAPI() {
            const resultEl = document.getElementById('profileResult');
            resultEl.textContent = 'Testing...';
            
            const token = localStorage.getItem('accessToken');
            if (!token) {
                resultEl.innerHTML = '<span class="error">❌ No access token found</span>';
                return;
            }

            try {
                const response = await fetch('/gateway/auth/profile', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                resultEl.innerHTML = 
                    `<span class="${response.ok ? 'success' : 'error'}">` +
                    `${response.ok ? '✅' : '❌'} Status: ${response.status} ${response.statusText}` +
                    `</span>\n\n` +
                    JSON.stringify(data, null, 2);
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }

        function clearAuth() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('user');
            alert('Auth data cleared!');
            location.reload();
        }

        // Initialize
        displayLocalStorage();
        displayToken();
        displayUser();
    </script>
</body>
</html>
